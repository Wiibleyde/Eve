name: eve-prod

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-eve}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eve} -d ${POSTGRES_DB:-eve}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  lavalink-init:
    image: busybox:latest
    command: ["chown", "-R", "322:322", "/plugins"]
    volumes:
      - lavalink_plugins:/plugins
    restart: "no"

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    depends_on:
      lavalink-init:
        condition: service_completed_successfully
    environment:
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:?LAVALINK_PASSWORD is required}
    volumes:
      - ./docker/lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink_plugins:/opt/Lavalink/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --header \"Authorization: ${LAVALINK_PASSWORD}\" http://localhost:2333/version"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  eve:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: ${IMAGE:-ghcr.io/wiibleyde/eve}:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      lavalink:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-eve}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eve}?sslmode=disable}
      API_PORT: 3000
      TZ: ${TZ:-Europe/Paris}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      LAVALINK_ADDRESS: ${LAVALINK_ADDRESS:-lavalink:2333}
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD}
    ports:
      - "${API_PUBLIC_PORT:-3000}:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  lavalink_plugins:
